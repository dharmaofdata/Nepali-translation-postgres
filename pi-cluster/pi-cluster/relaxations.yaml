# Only relaxations whose broken semantics are defined (Developer Guide §29).
# Others named in §28 (no_cgroup_limits, fast_boot, no_reset, ...) have no
# `breaks` defined yet and are intentionally absent; see docs/GUIDE-GAPS.md.
relaxations:
  fast_kill:
    class: A
    breaks: [peers_see_silence]
  unfsynced_kept:
    class: A
    breaks: [unfsynced_loss]
  dev_tree_artifact:
    class: B
    breaks: [artifact_delivery_path]
