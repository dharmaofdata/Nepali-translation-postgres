name: smoke-hw-timing
nodes:
  count: 3
services:
  app:
    type: fake
    artifact: fake-service
    placement: {nodes: [n1, n2, n3]}
workload:
  type: synthetic
  duration: 3s
faults:
  - at: 1s
    action: node.off
    target: {role: primary}
checks:
  - name: target_processes_gone
    mandatory: true
  - name: test_requires_hw_timing
    mandatory: true
