name: pg-node-restart-short
nodes:
  count: 3
services:
  db:
    type: postgres
    artifact: postgres-16
    placement: {nodes: [n1, n2, n3]}
workload:
  type: sql
  duration: 25s
faults:
  - at: 5s
    action: node.off
    target: {role: primary}
  - at: 8s
    action: node.on
    target: {node_of: 1}
checks:
  - name: target_processes_gone
    mandatory: true
  - name: replication_streaming
    mandatory: true
  - name: standby_prefix_consistent
    mandatory: true
  - name: no_ipc_leak
    mandatory: true
  - name: no_dev_shm_leak
    mandatory: true
  - name: node_returns
    mandatory: true
  - name: postgres_recovers
    mandatory: true
  - name: replication_streaming_again
    mandatory: true
  - name: acked_prefix_present
    mandatory: true
