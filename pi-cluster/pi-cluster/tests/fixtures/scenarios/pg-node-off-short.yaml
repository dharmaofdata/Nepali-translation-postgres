# Same shape as scenarios/pg-node-off.yaml, shortened for the test suite.
name: pg-node-off-short
nodes:
  count: 3
services:
  db:
    type: postgres
    artifact: postgres-16
    placement: {nodes: [n1, n2, n3]}
workload:
  type: sql
  duration: 8s
faults:
  - at: 4s
    action: node.off
    target: {role: primary}
checks:
  - name: replication_streaming
    mandatory: true
  - name: standby_prefix_consistent
    mandatory: true
  - name: target_processes_gone
    mandatory: true
