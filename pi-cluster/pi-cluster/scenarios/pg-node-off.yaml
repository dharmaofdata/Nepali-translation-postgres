name: pg-node-off

nodes:
  count: 3

services:
  db:
    type: postgres
    artifact: postgres-16
    placement: {nodes: [n1, n2, n3]}

workload:
  type: sql
  duration: 20s

faults:
  - at: 10s
    action: node.off
    target: {role: primary}

checks:
  - name: replication_streaming
    mandatory: true
  - name: standby_prefix_consistent
    mandatory: true
  - name: target_processes_gone
    mandatory: true
