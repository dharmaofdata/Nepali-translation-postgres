# Service types known to the controller.  Ports, roles and the agent-side
# adapter are config intent: the same on every node and every backend.
# `driven_by` names the workload type that can drive this service, if any.
services:
  fake:
    port: 5432
    adapter: services.fake:FakeService
    role_order: [primary, replica]
    driven_by: synthetic
    params: {}
  postgres:
    port: 5432
    adapter: services.postgres:PostgresService
    role_order: [primary, replica]
    driven_by: sql
    params:
      run_as: postgres          # the server refuses to run as root (main.c)
      superuser: pic
      database: pic
      # Configuration intent.  The agent renders effective config from it;
      # node-local paths (socket dir, primary host) are filled in there.
      guc:
        listen_addresses: "'*'"
        wal_level: replica
        max_wal_senders: "10"
        hot_standby: "on"
        synchronous_commit: "on"
        log_line_prefix: "'%m [%p] '"
  # pg_auto_failover: one monitor service and one HA-managed postgres
  # service.  Both run pg_autoctl, which supervises its own PostgreSQL; the
  # roles of the database nodes are the monitor's business, not ours.
  pgaf:
    port: 5432
    adapter: services.pgaf:PgafMonitorService
    role_order: [monitor]
    driven_by: null
    params:
      run_as: postgres
      superuser: pic
      database: pic
      monitor_user: autoctl_node
      monitor_database: pg_auto_failover
  pgaf-postgres:
    port: 5432
    adapter: services.pgaf:PgafKeeperService
    role_order: [primary, replica, member]
    driven_by: sql
    params:
      run_as: postgres
      superuser: pic
      database: pic
      monitor_service: monitor       # which service in the scenario is the monitor
      monitor_user: autoctl_node
      monitor_database: pg_auto_failover
      client_hba: "host all pic 0.0.0.0/0 trust"
