# Hardware-class overlay: timing and addressing are data, not controller code.
network:
  subnet: 10.3.14.0/24
  bench_addr: 10.3.14.1        # host side of the bench bridge; controller listens here in the skeleton
  node_addr_base: 10           # n1 -> 10.3.14.11
  bridge: pic-br0
controller:
  port: 7070
  artifact_port: 7071
timing:
  heartbeat_interval: 0.2s
  unavailable_after: 1.0s
  register_timeout: 10s
  service_ready_timeout: 30s
  service_deploy_timeout: 120s
  workload_request_timeout: 0.5s
  kill_settle_timeout: 2s
  node_return_timeout: 30s
storage:
  node_root: /var/tmp/picluster/nodes   # per-node dir; disk/ outlives node.off
  dev_shm_size: 256m
  tmp_size: 512m
